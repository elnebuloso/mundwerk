name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Don't tune whisper.cpp for the runner's CPU, or older PCs crash with "illegal instruction".
  # shortcut: AVX without AVX2 runs on CPUs from ~2011 on but leaves speed on newer ones; add an AVX2 artifact if needed
  GGML_NATIVE: "OFF"
  GGML_AVX: "ON"
  GGML_AVX2: "OFF"
  GGML_FMA: "OFF"
  GGML_F16C: "ON"
  # whisper.cpp's Vulkan shader build nests deep enough to pass Windows' 260-character path limit under ./target
  CARGO_TARGET_DIR: C:/t

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows only for now: it is the one target where the GPU (Vulkan) is reachable
          - os: windows-latest
            bin: C:/t/release/mundwerk.exe
            asset: mundwerk-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked
          cargo test --release --locked
          cp "${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}
