name: CI

# Pull requests build and test both platforms. A push to main does the same, then semantic-release
# tags and publishes a GitHub release with both binaries; without `feat` or `fix` since the last tag
# nothing is released.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue instead of overlapping, so two quick pushes can't compute the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Don't tune whisper.cpp for the runner's CPU, or older PCs crash with "illegal instruction".
  # shortcut: AVX without AVX2 runs on CPUs from ~2011 on but leaves speed on newer ones; add an AVX2 artifact if needed
  GGML_NATIVE: "OFF"
  GGML_AVX: "ON"
  GGML_AVX2: "OFF"
  GGML_FMA: "OFF"
  GGML_F16C: "ON"

jobs:
  # The binaries are built before the release exists, so the version they report is computed first.
  version:
    runs-on: ubuntu-24.04
    # semantic-release checks push access even on a dry run; nothing is pushed here.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # Sets no version outside main or when no release is due; the build then reports the one in Cargo.toml.
      - id: next
        run: npx --package semantic-release@25.0.9 --package @semantic-release/exec@7.1.0 semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc -> runs on more distros
            target_dir: target
            bin: target/release/mundwerk
            asset: mundwerk-linux-x86_64
          - os: windows-latest
            # whisper.cpp's Vulkan shader build nests deep enough to pass Windows' 260-character path limit under ./target
            target_dir: C:/t
            bin: C:/t/release/mundwerk.exe
            asset: mundwerk-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      MUNDWERK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev libasound2-dev
      # cargo directly rather than `make`: windows-latest has no GNU make, and CI needs `--locked`.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked
          cargo test --release --locked
          cp "${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # semantic-release reads every commit since the last tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      # shortcut: npx without a lockfile, so the plugins float within their ^ ranges; pin them in a package.json with a lockfile if a release ever breaks from it.
      - run: npx --package semantic-release@25.0.9 --package @semantic-release/exec@7.1.0 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
